spring.application.name=PhegonHotel
#MYSQL CONNECTION
server.port=4040
spring.datasource.url=jdbc:mysql://localhost:3306/phegon_hotel_db
spring.datasource.username=root
spring.datasource.password=admin1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update



#THE MAXIMUM SIGN OF IMAGE THAT CAN BE UPLOADED
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB


# AWS S3 CONFIGURATION
aws.s3.access.key=${AWS_ACCESS_KEY_ID}
aws.s3.secret.key=${AWS_SECRET_ACCESS_KEY}
aws.s3.region=ap-southeast-2
aws.s3.bucket=phegon-hotel-images-2026
